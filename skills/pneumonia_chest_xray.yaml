        "task": "segment_lung_opacity",
        "required_modalities": ["Chest X-ray"],
        "reason": "对候选浸润影/实变影生成 mask 和面积、位置等结构化证据。"
      },
      {
        "task": "assess_complicated_or_uncertain_pneumonia",
        "required_modalities": ["Chest CT"],
        "reason": "胸片不清楚、病变复杂或需排查并发症/替代诊断时需要 CT。"
      }
    ],
    "required_modalities": {
      "lung_opacity": ["Chest X-ray"],
      "consolidation": ["Chest X-ray"],
      "pleural_effusion": ["Chest X-ray"],
      "complicated_pneumonia": ["Chest CT"],
      "alternative_diagnosis": ["Chest CT"]
    },
    "measurements": [
