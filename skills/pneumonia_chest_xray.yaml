  "staging_rules": {
    "imaging_supportive_finding": {
      "description": "胸片可提供肺部浸润影、实变影或多灶阴影等支持性影像证据，但不能单独确定病原学或完整临床诊断。",
      "xray_features": ["局灶或多灶肺部浸润影", "肺叶或肺段实变影", "伴随胸腔积液"]
    },
    "clinical_correlation_required": {
      "description": "CAP 诊断需要结合症状、体征、实验室检查和影像表现；影像阴性或质量不足时不能直接排除。",
      "required_non_imaging_evidence": ["体温", "血氧", "白细胞或炎症指标", "病原学检查", "临床查体"]
    }
  },
